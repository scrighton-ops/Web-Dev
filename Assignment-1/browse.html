<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <title>Browse - Adopt Me</title>
        <link rel ="stylesheet" href="styles/styles.css">
        <link rel ="stylesheet" href="styles/browse.css">
    </head>
    <body>
        <header>
            <img src="images/pets-banner.jpg" alt="credits -> https://stittsvillesmallanimalclinic.ca/clients-2/current-clients/pets-banner/">
            <h1>Adopt Me</h1>
            <div class = nav>
                <a href = "index.html">Home</a>
                <a href = "browse.html">Browse</a>
                <a href = "about.html">About</a>
            </div>
        </header>
        <section class="shelter">
            <h2> Select A Shelter</h2>
            <label for="shelter">Choose a Shelter</label>
            <select id="shelter">
                <option>Happy Tails Rescue</option>
                <option>Paws & Whiskers Haven</option>
                <option>Second Chance Animals</option>
                <option>Forever Friends Shelter</option>
            </select>
        </section>
        
        <section class = buttons>
            <button id="all" class="selected">All</button>
            <button id="cats">Cats</button>
            <button id="dogs">Dogs</button>
            <button id="birds">Birds</button>
            <button id="reptiles" disabled>Reptiles</button>
            <button id="other" disabled>Other</button>
        </section>
        <section class = animal>
            <div>
                <img src="images/dog1.jpg" alt="Milo" width="200">
                <h3>Milo</h3>
                <a href="pet.html">View Details</a>
            </div>
            <hr>
            <div>
                <img src="images/cat1.jpg" alt="Luna" width="200">
                <h3>Luna</h3>
                <a href="pet.html">View Details</a>
            </div>
            <hr>
            <div>
                <img src="images/dog2.jpg" alt="Rocky" width="200">
                <h3>Rocky</h3>
                <a href="pet.html">View Details</a>
            </div>
            <hr>
            <div>
                <img src="images/parrot1.jpg" alt="Coco" width="200">
                <h3>Coco</h3>
                <a href="pet.html">View Details</a>
            </div>
        </section>
        
        <footer>
            <p>&copy;2026 Adopt Me </p> <div id="slogan"><p> Give A Forever Home. Find A Forever Friend</p></div>
        </footer>
    </body>
</html>
